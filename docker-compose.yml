services:
  postgres-dwh:
    image: docker.m.daocloud.io/library/postgres:17-alpine
    container_name: bank_dwh
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts:/docker-entrypoint-initdb.d
    networks:
      - etl_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5

  s3-storage:
    # Локальный S3-совместимый эмулятор для разработки
    # В промышленной среде используется Arenadata S3
    image: chrislusf/seaweedfs
    container_name: bank_datalake
    command: "server -s3 -dir=/data -s3.port=9000"
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Веб-интерфейс
    volumes:
      - s3data:/data
    networks:
      - etl_network

  airflow-init:
    image: docker.m.daocloud.io/apache/airflow:2.7.3-python3.10
    container_name: airflow-init
    environment:
      AIRFLOW_UID: ${AIRFLOW_UID}
    entrypoint: /bin/bash
    command: -c "chown -R 50000:0 /opt/airflow"
    volumes:
      - ./airflow:/opt/airflow

volumes:
  pgdata:
  s3data:

networks:
  etl_network:
    driver: bridge